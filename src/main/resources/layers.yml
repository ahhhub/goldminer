# ==================== GoldMiner 分层矿场配置 ====================
# 矿场从上到下由若干"层级"组成，最底部自动生成基岩层（默认 1 格）。
# 本文件中 layers 的书写顺序 = 矿场中从上到下的顺序。
#
# 每个层级由"基石"与"矿石"两部分组成：
#   - base-blocks（基石）：构成该层级大部分质量的方块
#   - ores（矿石）：该层级的矿物与特殊方块
#   两者在整体生成中的占比由 global.base-weight-percent / ore-weight-percent 控制
#   （默认 95% / 5%，可在 global 中修改）。
#
# 继承机制：上层矿石会自动"继承"到下层（每深一层权重乘以 global.inherit-decay），
# 即上一层矿物在下一层仍然出现，但概率显著减少；如此逐层累积。
# 单个矿石可设置 inherit: false，表示只在本层级刷新、不下沉。
#
# 每个方块可配置:
#   weight: 在所属池中的相对权重（越大越常见）
#   coin:   挖掉时给予的金币
#   exp:    挖掉时给予的经验

global:
  # 基石方块占整体生成概率的百分比
  base-weight-percent: 95.0
  # 矿石/特殊方块占整体生成概率的百分比
  ore-weight-percent: 5.0
  # 上层矿石继承到下一层的衰减系数（0.05 = 每深一层保留 5% 权重）
  inherit-decay: 0.05

# 基岩层（最底部，默认只占 1 格深度）
bedrock:
  height: 1
  block: BEDROCK

# 矿洞生成设置
caves:
  enabled: true
  # 每 10000 方块体积生成的矿洞数量（约数，自动按矿场体积缩放）
  count-per-10000: 0.5
  # 矿洞随机游走长度范围（步数）
  min-length: 25
  max-length: 55
  # 矿洞截面半径范围（每个矿洞随机一个半径）
  min-radius: 1
  max-radius: 3
  # 每个矿洞放置宝箱的概率
  chest-chance: 0.4

  # 大型矿洞：半径达到该值的矿洞视为大型矿洞
  # 大型矿洞会铺设铁轨，宝箱会替换为箱子矿车（类似原版废弃矿洞）
  large-radius: 3

  # 矿洞装饰（火把/灯/蜘蛛网）
  decorations:
    # 每个路径步放置火把的概率
    torch-chance: 0.12
    # 每个路径步放置灯（悬挂）的概率
    lantern-chance: 0.04
    # 每个路径步放置蜘蛛网的概率
    cobweb-chance: 0.06

  # 大型矿洞铁轨
  rails:
    # 每个大型矿洞最多铺设的铁轨数
    max-per-cave: 14

  # 普通矿洞敌对生物
  normal-mobs:
    # 每个普通矿洞刷新的生物数量范围（最多不超过 max-per-cave）
    min-per-cave: 1
    max-per-cave: 3
    # 随机生物类型（蜘蛛/僵尸等敌对生物）
    types: [ZOMBIE, SPIDER]

  # 硫黄矿洞（偶发替换普通矿洞，仅深层刷新）
  sulfur-cave:
    # 普通矿洞被替换为硫黄矿洞的概率（小概率）
    chance: 0.1
    # 仅在矿场该深度以下刷新（% 矿场总高度，100=最深处；防止接近地表刷新）
    # 注：配置了 sulfur 层时自动以硫黄层顶部为深度上限，此值作为无硫黄层时的回退
    min-depth-percent: 60
    # 硫黄矿洞宝箱爆率提升倍率（在 chest-chance 基础上放大）
    chest-chance-boost: 1.5
    # 硫黄矿洞内的随机生物（找不到时回退为 MAGMA_CUBE）
    sulfur-mob: SULFUR_CUBE
    mob-min: 1
    mob-max: 3

